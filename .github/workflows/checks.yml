name: Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish release (requires verified OJS installation and upgrade tests)'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  checks:
    name: Checks / static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: PHP syntax
        run: find . -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: JavaScript syntax
        run: |
          for f in styles/*.js tests/*.mjs; do node --check "$f"; done
      - name: Bash test runner syntax
        run: for f in tests/*.sh; do bash -n "$f"; done
      - name: CSS changes nothing above 900 px
        run: |
          out=$(node tests/css-check.mjs styles/mobile.css) || { echo "Rules outside @media (max-width: 900px): $out"; exit 1; }
      - name: Version format and plugin name
        run: |
          rel=$(grep -o '<release>[^<]*' version.xml | cut -d'>' -f2)
          app=$(grep -o '<application>[^<]*' version.xml | cut -d'>' -f2)
          [[ "$rel" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Bad version: $rel"; exit 1; }
          [ "$app" = mobileDashboard ] || { echo "Bad application name: $app"; exit 1; }
      - name: Same locale keys in English and Italian
        run: diff <(grep '^msgid "' locale/en/locale.po | sort) <(grep '^msgid "' locale/it/locale.po | sort)
      - name: Copyright and SPDX headers
        run: |
          while IFS= read -r -d '' path; do
            case "$path" in LICENSE|*.png|*.md|.gitignore|.gitattributes|.github/CODEOWNERS) continue;; esac
            head -n 20 "$path" | grep -Fq 'Copyright (C) 2026 Stefano Natangelo' || { echo "Missing copyright: $path"; exit 1; }
            head -n 20 "$path" | grep -Fq 'SPDX-License-Identifier: AGPL-3.0-only' || { echo "Missing SPDX: $path"; exit 1; }
          done < <(git ls-files -z)

      - name: Build and verify release archive
        run: python3 scripts/package-release.py
      - name: Store verified package
        uses: actions/upload-artifact@v4
        with:
          name: mobile-dashboard-release
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish verified release
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mobile-dashboard-release
          path: dist
      - name: Publish release for the tested commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(python3 -c 'import xml.etree.ElementTree as E; print(E.parse("version.xml").findtext("release"))')
          [[ "$version" =~ ^[0-9]+(\.[0-9]+){3}$ ]]
          archive="mobileDashboard-$version.tar.gz"
          (cd dist && md5sum -c "$archive.md5" && sha256sum -c "$archive.sha256")
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "Tag already exists; refusing to replace a published version." >&2
            exit 1
          else
            status=$?
            [[ "$status" == 2 ]] || exit "$status"
          fi
          gh release create "v$version" "dist/$archive" "dist/$archive.md5" "dist/$archive.sha256" \
            --target "$GITHUB_SHA" --title "Mobile Dashboard $version" --generate-notes
